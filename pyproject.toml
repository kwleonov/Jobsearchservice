[project]
name = "jobsearchservice"
version = "0.1.0"
description = "coursework 02 for sky.pro"
authors = [
    {name = "Konstantin Leonov",email = "leonovkw@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "isort (>=6.0.0,<7.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "flake8 (>=7.1.1,<8.0.0)",
    "mypy (>=1.15.0,<2.0.0)",
    "pytest (>=8.3.4,<9.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'


[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.git          # исключить .git в корне проекта
  )/
)
'''


[tool.isort]
# максимальная длина строки
line_length = 119

